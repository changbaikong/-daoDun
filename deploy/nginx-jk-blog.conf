# Jk 博客 —— congyu.xyz 站点配置
# 目标路径：/etc/nginx/sites-available/jk-blog
#
# 结构说明：
#   1) 80 默认站点：保留 IP 直连（调试 / 健康检查用），继续反向代理到应用；
#   2) 80 域名站点：HTTP 全部 301 到 HTTPS，但保留 ACME 验证路径供 certbot 续期；
#   3) 443 主域名：HTTPS 反向代理到 127.0.0.1:4173；
#   4) 443 www：301 到主域名。
#
# 证书由 Let's Encrypt / certbot 签发，续期由 certbot.timer（systemd）自动完成。
# 若证书目录名不是 congyu.xyz，请同步修改下面两个 ssl_certificate* 路径。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# HTTP -> HTTPS（ACME 验证路径除外）
server {
    listen 80;
    listen [::]:80;
    server_name congyu.xyz www.congyu.xyz;

    # Let's Encrypt HTTP-01 验证目录，certbot --webroot 续期时需要
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://congyu.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name congyu.xyz;

    ssl_certificate     /etc/letsencrypt/live/congyu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/congyu.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 应用层（server/src/server.js）已经设置 X-Content-Type-Options / Referrer-Policy，
    # 这里只补它没有的 HSTS，避免响应头重复。
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.congyu.xyz;

    ssl_certificate     /etc/letsencrypt/live/congyu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/congyu.xyz/privkey.pem;

    return 301 https://congyu.xyz$request_uri;
}
