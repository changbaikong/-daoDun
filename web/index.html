<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>刀盾的小屋 · 看板娘起始页</title>
    <meta
      name="description"
      content="刀盾的小屋：Node.js + SQLite 搭起来的博客地基，主库登记账号、每个账号一个独立的文章库。"
    />
    <meta name="theme-color" content="#070b18" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#feed">跳到文章列表</a>

    <div class="scene" aria-hidden="true">
      <div class="scene-bg"></div>
      <div class="scene-stars"></div>
      <div class="scene-glow scene-glow--a"></div>
      <div class="scene-glow scene-glow--b"></div>
      <div class="scene-veil"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text" data-site="title">刀盾的小屋</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link is-active" href="/" aria-current="page">首页</a>
        <a class="nav-link" href="/articles">文章</a>
        <a class="nav-link" href="/about">关于</a>
      </nav>
      <span class="topbar-badge">SQLite · 账号分库</span>
    </header>

    <main>
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">
            <span class="eyebrow-dot" aria-hidden="true"></span>
            Welcome to <span data-site="owner">Jk</span>'s corner
          </p>
          <h1 class="hero-title" id="hero-title" data-site="title">刀盾的小屋</h1>
          <p class="hero-greeting" id="hero-greeting" aria-live="polite">……</p>
          <p class="hero-subtitle" data-site="subtitle">
            在代码与星光之间，写一点想写的东西。
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="/articles">
              进入博客 <span class="btn-arrow" aria-hidden="true">→</span>
            </a>
            <a class="btn btn-ghost" href="/about">关于小站</a>
          </div>
          <dl class="stats" aria-label="站点数据">
            <div class="stat">
              <dt>作者账号</dt>
              <dd id="stat-accounts">—</dd>
            </div>
            <div class="stat">
              <dt>文章总数</dt>
              <dd id="stat-articles">—</dd>
            </div>
            <div class="stat">
              <dt>已发布</dt>
              <dd id="stat-published">—</dd>
            </div>
          </dl>
        </div>

        <a class="scroll-hint" href="#feed" aria-label="向下滚动查看文章">
          <span class="scroll-hint-text">向下滚动</span>
          <span class="scroll-hint-arrow" aria-hidden="true">↓</span>
        </a>
      </section>

      <div class="content-stage">
        <div class="screen-divider" aria-hidden="true" data-reveal><span>✦</span></div>

        <section class="section feed-section" id="feed" aria-labelledby="feed-title" data-reveal>
          <div class="section-head">
            <div>
              <p class="section-kicker">Latest posts</p>
              <h2 class="section-title" id="feed-title">最新文章</h2>
            </div>
            <div class="section-side">
              <p class="section-note">所有账号的已发布文章，按时间排序。</p>
              <a class="section-link" href="/articles">查看全部文章 <span aria-hidden="true">→</span></a>
            </div>
          </div>
          <div class="filter-bar" id="filter-bar" role="group" aria-label="按账号筛选文章">
            <button class="filter-chip is-active" type="button" data-account="">全部账号</button>
          </div>
          <div class="feed" id="feed-list">
            <p class="feed-state">正在读取文章库…</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p data-site="footer">© 2026 Jk · 用 SQLite 写下每一个字</p>
      <p class="footer-meta">背景 2560 × 1440 (16:9) · 移动 1080 × 1920 (9:16)</p>
    </footer>

    <div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <div class="reader-backdrop" data-close="reader"></div>
      <article class="reader-panel">
        <button class="reader-close" type="button" data-close="reader" aria-label="关闭文章">×</button>
        <p class="reader-kicker" id="reader-kicker">Article</p>
        <h2 class="reader-title" id="reader-title">加载中…</h2>
        <p class="reader-meta" id="reader-meta"></p>
        <div class="reader-body" id="reader-body"></div>
      </article>
    </div>

    <div class="toast" id="toast" hidden role="status"></div>
    <noscript>
      <p class="noscript">这个页面需要 JavaScript 才能读取文章列表，请启用后再试。</p>
    </noscript>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
