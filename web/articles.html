<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章 · 刀盾的小屋</title>
    <meta
      name="description"
      content="刀盾的小屋的文章归档：所有账号的已发布文章，按发布时间排序，点开即可阅读。"
    />
    <meta name="theme-color" content="#070b18" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#post-list">跳到文章列表</a>

    <div class="scene" aria-hidden="true">
      <div class="scene-bg"></div>
      <div class="scene-stars"></div>
      <div class="scene-glow scene-glow--a"></div>
      <div class="scene-glow scene-glow--b"></div>
      <div class="scene-veil"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text" data-site="title">刀盾的小屋</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link" href="/">首页</a>
        <a class="nav-link is-active" href="/articles" aria-current="page">文章</a>
        <a class="nav-link" href="/about">关于</a>
      </nav>
      <span class="topbar-badge">SQLite · 账号分库</span>
    </header>

    <div class="content-stage content-stage--page">
      <main class="library-main">
        <div class="page-head">
          <div>
            <p class="section-kicker">All posts</p>
            <h1 class="page-title">文章</h1>
          </div>
          <p class="page-note" id="page-note">正在读取文章库…</p>
        </div>

        <div class="filter-bar" id="filter-bar" role="group" aria-label="按账号筛选文章">
          <button class="filter-chip is-active" type="button" data-account="">全部账号</button>
        </div>

        <div class="feed library-feed" id="post-list">
          <p class="feed-state">正在读取文章库…</p>
        </div>

        <div class="library-more" id="library-more" hidden>
          <button class="btn btn-ghost" type="button" id="load-more">加载更多</button>
        </div>
      </main>
    </div>

    <footer class="footer">
      <p data-site="footer">© 2026 Jk · 用 SQLite 写下每一个字</p>
      <p class="footer-meta">文章归档 · 每个账号一个独立的 SQLite 文章库</p>
    </footer>

    <div class="toast" id="toast" hidden role="status"></div>
    <noscript>
      <p class="noscript">这个页面需要 JavaScript 才能读取文章列表，请启用后再试。</p>
    </noscript>

    <script type="module" src="/js/articles.js"></script>
  </body>
</html>
