<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章 · 刀盾的小屋</title>
    <meta
      name="description"
      content="刀盾的小屋的文章归档：所有账号的已发布文章，按发布时间排序，点开即可阅读。"
    />
    <meta name="theme-color" content="#070b18" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="page-articles">
    <a class="skip-link" href="#post-list">跳到文章列表</a>

    <header class="topbar">
      <a class="brand" href="/" aria-label="回到首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text" data-site="title">刀盾的小屋</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link" href="/">首页</a>
        <a class="nav-link is-active" href="/articles" aria-current="page">文章</a>
        <a class="nav-link" href="/about">关于</a>
      </nav>
      <span class="topbar-badge">SQLite · 账号分库</span>
    </header>

    <main class="articles-page">
      <section class="articles-hero" aria-labelledby="page-title">
        <div class="articles-hero-backdrop" aria-hidden="true"></div>
        <div class="articles-hero-frame">
          <img
            class="articles-hero-img"
            src="/assets/articles-hero.jpg"
            alt=""
            width="1280"
            height="720"
            decoding="async"
            fetchpriority="high"
          />
        </div>
        <div class="articles-hero-inner">
          <div class="page-head">
            <div>
              <p class="section-kicker">All posts</p>
              <h1 class="page-title" id="page-title">文章</h1>
            </div>
            <p class="page-note" id="page-note">正在读取文章库…</p>
          </div>
        </div>
      </section>

      <section class="articles-library" aria-label="文章列表">
        <div class="library-main library-main--opaque" data-reveal>
          <div class="feed library-feed" id="post-list">
            <p class="feed-state">正在读取文章库…</p>
          </div>

          <div class="library-more" id="library-more" hidden>
            <button class="btn btn-ghost" type="button" id="load-more">加载更多</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p data-site="footer">© 2026 DaoDun · 用 SQLite 写下每一个字</p>
      <p class="footer-meta">文章归档 · 按发布时间排序</p>
    </footer>

    <div class="toast" id="toast" hidden role="status"></div>
    <noscript>
      <p class="noscript">这个页面需要 JavaScript 才能读取文章列表，请启用后再试。</p>
    </noscript>

    <script type="module" src="/js/articles.js"></script>
  </body>
</html>
